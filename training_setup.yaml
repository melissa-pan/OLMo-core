tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /data/checkpoints
  save_interval: 5000

logging_args:
  log_interval: 10

training_parameters:
  num_training_steps: 250000
  eval_interval: 2500
  micro_batch_size: 6
  gradient_accumulation_steps: 1
  eval_during_training: true

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 3e-4
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-10

lr_scheduler_args:
  lr_decay_style: cosine
  num_warmup_steps: 2500
  num_constant_steps: 0
  num_decay_steps: 22500

mixed_precision_args:
  dtype: bf16

distributed_args:
  stage: 3
  torch_compile: true
  zero_topology:
    data_parallel_replication_world_size: 1
    data_parallel_sharding_world_size: 8
  # tensor_parallel_world_size: 2
  # sequence_parallel: true
